<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebLinux Terminal</title>
<style>
:root {
  --bg: #0d1117; --fg: #c9d1d9; --dir: #58a6ff; --exec: #3fb950;
  --error: #f85149; --info: #58a6ff; --prompt-user: #3fb950;
  --prompt-path: #58a6ff; --titlebar: #2d2d44; --titlebar-border: #3d3d5c;
  --scrollbar-track: #0d1117; --scrollbar-thumb: #30363d;
  --selection: #264f78;
}
[data-theme="dracula"] {
  --bg: #282a36; --fg: #f8f8f2; --dir: #8be9fd; --exec: #50fa7b;
  --error: #ff5555; --info: #bd93f9; --prompt-user: #50fa7b;
  --prompt-path: #8be9fd; --titlebar: #1e1f29; --titlebar-border: #44475a;
  --scrollbar-track: #282a36; --scrollbar-thumb: #44475a;
  --selection: #44475a;
}
[data-theme="monokai"] {
  --bg: #272822; --fg: #f8f8f2; --dir: #66d9ef; --exec: #a6e22e;
  --error: #f92672; --info: #ae81ff; --prompt-user: #a6e22e;
  --prompt-path: #66d9ef; --titlebar: #1e1f1c; --titlebar-border: #49483e;
  --scrollbar-track: #272822; --scrollbar-thumb: #49483e;
  --selection: #49483e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
  height: 100vh; display: flex; flex-direction: column;
}
::selection { background: var(--selection); }
.title-bar {
  background: var(--titlebar); padding: 10px 16px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--titlebar-border);
  user-select: none;
}
.title-bar .dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; transition: opacity .2s; }
.dot:hover { opacity: .8; }
.dot-red { background: #ff5f56; }
.dot-yellow { background: #ffbd2e; }
.dot-green { background: #27c93f; }
.title-bar span { color: #8888aa; font-size: 13px; margin-left: 12px; }
#terminal {
  background: var(--bg); color: var(--fg);
  padding: 12px; flex: 1; overflow-y: auto;
  font-size: 14px; line-height: 1.6; cursor: text;
}
#terminal::-webkit-scrollbar { width: 8px; }
#terminal::-webkit-scrollbar-track { background: var(--scrollbar-track); }
#terminal::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
.line { white-space: pre-wrap; word-break: break-all; }
.line.error { color: var(--error); }
.line.info { color: var(--info); }
.line.success { color: var(--exec); }
.line.dir { color: var(--dir); font-weight: bold; }
.line.dim { color: #666; }
.p-user { color: var(--prompt-user); }
.p-path { color: var(--prompt-path); }
.p-dollar { color: var(--fg); }
.input-row { display: flex; flex-wrap: nowrap; align-items: center; }
#cmd-input {
  background: transparent; border: none; color: var(--fg);
  font-family: inherit; font-size: inherit; outline: none;
  flex: 1; caret-color: var(--info);
}
#editor-overlay {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.85);
}
#editor-box {
  background: var(--bg); color: var(--fg); margin: 40px auto;
  max-width: 800px; height: calc(100vh - 80px);
  display: flex; flex-direction: column; border: 1px solid var(--titlebar-border);
  font-family: inherit; font-size: 14px;
}
#editor-bar {
  background: var(--titlebar); padding: 6px 16px;
  color: #aaa; display: flex; justify-content: space-between;
  border-bottom: 1px solid var(--titlebar-border);
}
#editor-text {
  flex: 1; background: transparent; color: var(--fg); border: none;
  padding: 12px; font-family: inherit; font-size: inherit;
  outline: none; resize: none; tab-size: 4;
}
@media (max-width: 600px) {
  #terminal { font-size: 12px; padding: 8px; }
  .title-bar { padding: 8px 12px; }
}
</style>
</head>
<body>
<div class="title-bar">
  <div class="dot dot-red" onclick="terminalAction('close')"></div>
  <div class="dot dot-yellow" onclick="terminalAction('minimize')"></div>
  <div class="dot dot-green" onclick="terminalAction('maximize')"></div>
  <span id="title-text">user@web-linux: ~</span>
</div>
<div id="terminal" onclick="focusInput()"></div>
<div id="editor-overlay">
  <div id="editor-box">
    <div id="editor-bar">
      <span id="editor-title">nano</span>
      <span>Ctrl+S Save &nbsp; Ctrl+X Exit</span>
    </div>
    <textarea id="editor-text" spellcheck="false"></textarea>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const termEl = $('#terminal');
const HISTORY_MAX = 500;
const FILE = 'file', DIR = 'dir';

// ── Theme Manager ──────────────────────────────────────
const Theme = {
  current: localStorage.getItem('wl-theme') || 'github-dark',
  names: ['github-dark', 'dracula', 'monokai'],
  set(name) {
    if (!this.names.includes(name)) { print(`Unknown theme: ${name}. Available: ${this.names.join(', ')}`, 'error'); return; }
    this.current = name;
    document.documentElement.setAttribute('data-theme', name === 'github-dark' ? '' : name);
    localStorage.setItem('wl-theme', name);
    print(`Theme set to ${name}`, 'success');
  },
  init() {
    if (this.current !== 'github-dark')
      document.documentElement.setAttribute('data-theme', this.current);
  }
};

// ── Virtual File System ────────────────────────────────
function mkDir(name) { return { type: DIR, name, children: {} }; }
function mkFile(name, content = '') { return { type: FILE, name, content, modified: new Date() }; }
function addC(parent, child) { parent.children[child.name] = child; return child; }

let root = mkDir('/');
let cwd = '/home/user';
let envVars = {
  HOME: '/home/user', USER: 'user', SHELL: '/bin/bash',
  PATH: '/usr/local/bin:/usr/bin:/bin', TERM: 'xterm-256color',
  LANG: 'en_US.UTF-8', EDITOR: 'nano', PWD: '/home/user'
};
let cmdHistory = [];
let historyIdx = -1;
let prevDir = '/home/user';

function initFS() {
  root = mkDir('/');
  const home = mkDir('home'); addC(root, home);
  const user = mkDir('user'); addC(home, user);

  addC(user, mkDir('Documents'));
  addC(user, mkDir('Downloads'));
  addC(user, mkDir('Pictures'));
  addC(user, mkDir('projects'));
  addC(user, mkDir('.ssh'));
  addC(user, mkDir('.config'));

  const docs = user.children['Documents'];
  addC(docs, mkFile('readme.txt', 'Welcome to WebLinux!\nThis is a simulated Linux terminal.\nType "help" for available commands.\n'));
  addC(docs, mkFile('notes.txt', 'Meeting notes:\n- Review Q1 targets\n- Discuss new architecture\n- Plan next sprint\n'));
  addC(docs, mkFile('todo.md', '# TODO\n- [x] Learn Linux commands\n- [ ] Build a website\n- [ ] Deploy to production\n- [ ] Write documentation\n'));
  addC(docs, mkFile('log.txt', '[2026-05-01] System initialized\n[2026-05-02] Added new commands\n[2026-05-03] Fixed tab completion\n[2026-05-04] Added theme support\n'));

  const proj = user.children['projects'];
  const webapp = mkDir('webapp'); addC(proj, webapp);
  addC(webapp, mkFile('index.html', '<!DOCTYPE html>\n<html>\n<head><title>My App</title></head>\n<body>\n  <h1>Hello World</h1>\n  <p>Welcome to my web app.</p>\n</body>\n</html>'));
  addC(webapp, mkFile('style.css', '/* Main styles */\nbody {\n  font-family: sans-serif;\n  margin: 0;\n  padding: 20px;\n  background: #f5f5f5;\n}\nh1 { color: #333; }\n'));
  addC(webapp, mkFile('app.js', '// Application entry point\nconsole.log("App loaded!");\n\nfunction greet(name) {\n  return `Hello, ${name}!`;\n}\n\ngreet("World");\n'));
  addC(webapp, mkFile('package.json', '{\n  "name": "webapp",\n  "version": "1.0.0",\n  "description": "A simple web application",\n  "main": "app.js",\n  "scripts": {\n    "start": "node app.js",\n    "test": "echo \\"No tests\\""\n  }\n}'));

  const api = mkDir('api-server'); addC(proj, api);
  addC(api, mkFile('server.py', 'from flask import Flask, jsonify\n\napp = Flask(__name__)\n\n@app.route("/api/hello")\ndef hello():\n    return jsonify({"message": "Hello from API!"})\n\nif __name__ == "__main__":\n    app.run(port=5000)\n'));
  addC(api, mkFile('requirements.txt', 'flask==3.0.0\nrequests==2.31.0\n'));

  const dl = user.children['Downloads'];
  addC(dl, mkFile('data.csv', 'id,name,email,city\n1,Alice,alice@example.com,Beijing\n2,Bob,bob@example.com,Shanghai\n3,Charlie,charlie@example.com,Shenzhen\n4,Diana,diana@example.com,Guangzhou\n5,Eve,eve@example.com,Hangzhou\n'));

  addC(user, mkFile('.bashrc', '# ~/.bashrc\nexport PATH=$PATH:/usr/local/bin\nalias ll="ls -la"\nalias cls="clear"\nalias ..="cd .."\n'));
  addC(user, mkFile('.gitconfig', '[user]\n  name = WebUser\n  email = user@weblinux.dev\n[core]\n  editor = nano\n[alias]\n  st = status\n  co = checkout\n  br = branch\n'));
  addC(user, mkFile('.profile', '# ~/.profile\nif [ -f ~/.bashrc ]; then\n  . ~/.bashrc\nfi\n'));
  addC(user.children['.ssh'], mkFile('known_hosts', '# No known hosts yet\n'));

  const etc = mkDir('etc'); addC(root, etc);
  addC(etc, mkFile('hostname', 'web-linux'));
  addC(etc, mkFile('passwd', 'root:x:0:0:root:/root:/bin/bash\nuser:x:1000:1000:User:/home/user:/bin/bash\nnobody:x:65534:65534:Nobody:/nonexistent:/usr/sbin/nologin'));
  addC(etc, mkFile('os-release', 'NAME="WebLinux"\nVERSION="1.0"\nID=weblinux\nPRETTY_NAME="WebLinux 1.0"\nHOME_URL="https://weblinux.dev"'));
  addC(etc, mkFile('hosts', '127.0.0.1\tlocalhost\n127.0.1.1\tweb-linux\n::1\t\tlocalhost ip6-localhost'));

  const vr = mkDir('var'); addC(root, vr);
  const log = mkDir('log'); addC(vr, log);
  addC(log, mkFile('syslog', 'May  4 00:00:01 web-linux kernel: WebLinux booted\nMay  4 00:00:02 web-linux systemd: Started user session\nMay  4 00:00:03 web-linux sshd: Listening on 0.0.0.0:22\nMay  4 00:00:04 web-linux cron: Started cron daemon\n'));
  addC(log, mkFile('auth.log', 'May  4 00:00:05 web-linux sshd: Accepted key for user\nMay  4 00:00:06 web-linux sudo: user : TTY=pts/0 ; PWD=/home/user ; USER=root ; COMMAND=/bin/ls\n'));

  addC(root, mkDir('tmp'));
  addC(root, mkDir('usr'));
  addC(root, mkDir('bin'));
  addC(root, mkDir('opt'));
}

function resolvePath(p) {
  if (!p) return cwd;
  if (p.startsWith('~')) p = '/home/user' + p.slice(1);
  let parts;
  if (p.startsWith('/')) parts = p.split('/').filter(Boolean);
  else parts = [...cwd.split('/').filter(Boolean), ...p.split('/').filter(Boolean)];
  const r = [];
  for (const s of parts) {
    if (s === '.') continue;
    if (s === '..') { r.pop(); continue; }
    r.push(s);
  }
  return '/' + r.join('/');
}

function getNode(p) {
  const resolved = resolvePath(p);
  if (resolved === '/') return root;
  let node = root;
  for (const s of resolved.split('/').filter(Boolean)) {
    if (!node || node.type !== DIR || !node.children[s]) return null;
    node = node.children[s];
  }
  return node;
}

function parentOf(p) {
  const resolved = resolvePath(p);
  const parts = resolved.split('/').filter(Boolean);
  const name = parts.pop();
  const parentNode = getNode('/' + parts.join('/'));
  return { parent: parentNode, name };
}

// ── Output helpers ─────────────────────────────────────
let lastInputRow;
function print(text, cls = '') {
  const d = document.createElement('div');
  d.className = 'line' + (cls ? ' ' + cls : '');
  d.innerHTML = text;
  termEl.insertBefore(d, lastInputRow);
  scrollBottom();
}
function printRaw(text) { print(esc(text)); }

function promptHtml() {
  let dp = cwd;
  if (cwd.startsWith('/home/user')) dp = '~' + cwd.slice(10);
  if (!dp) dp = '~';
  return `<span class="p-user">user@web-linux</span>:<span class="p-path">${esc(dp)}</span><span class="p-dollar">$ </span>`;
}

function scrollBottom() { termEl.scrollTop = termEl.scrollHeight; }
function focusInput() { const i = $('#cmd-input'); if (i) i.focus(); }

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function newInputRow() {
  if (lastInputRow) {
    const old = lastInputRow.querySelector('#cmd-input');
    if (old) old.disabled = true;
  }
  const row = document.createElement('div');
  row.className = 'input-row';
  row.innerHTML = promptHtml();
  const inp = document.createElement('input');
  inp.id = 'cmd-input'; inp.autofocus = true; inp.autocomplete = 'off'; inp.spellcheck = false;
  row.appendChild(inp);
  termEl.appendChild(row);
  lastInputRow = row;
  inp.addEventListener('keydown', onKey);
  inp.focus();
  scrollBottom();
}

// ── Key handling ───────────────────────────────────────
let tabIdx = -1, tabMatches = [];

function onKey(e) {
  const inp = e.target;
  if (e.key === 'Enter') {
    e.preventDefault();
    const cmd = inp.value;
    inp.disabled = true;
    lastInputRow.innerHTML = promptHtml() + esc(cmd);
    cmdHistory.push(cmd);
    if (cmdHistory.length > HISTORY_MAX) cmdHistory.shift();
    historyIdx = -1; tabIdx = -1; tabMatches = [];
    run(cmd);
    envVars.PWD = cwd;
    $('#title-text').textContent = `user@web-linux: ${cwd === '/home/user' ? '~' : cwd}`;
    newInputRow();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (cmdHistory.length && historyIdx < 0) historyIdx = cmdHistory.length;
    if (historyIdx > 0) inp.value = cmdHistory[--historyIdx];
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIdx >= 0) {
      historyIdx++;
      inp.value = historyIdx >= cmdHistory.length ? '' : cmdHistory[historyIdx];
      if (historyIdx >= cmdHistory.length) historyIdx = -1;
    }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    doTab(inp);
  } else if (e.ctrlKey || e.metaKey) {
    // Readline-style shortcuts
    switch (e.key.toLowerCase()) {
      case 'a': // Ctrl+A: go to beginning of line
        e.preventDefault(); inp.selectionStart = inp.selectionEnd = 0; break;
      case 'e': // Ctrl+E: go to end of line
        e.preventDefault(); inp.selectionStart = inp.selectionEnd = inp.value.length; break;
      case 'u': // Ctrl+U: clear line before cursor
        e.preventDefault();
        inp.value = inp.value.slice(inp.selectionStart);
        inp.selectionStart = inp.selectionEnd = 0; break;
      case 'k': // Ctrl+K: clear line after cursor
        e.preventDefault();
        inp.value = inp.value.slice(0, inp.selectionStart); break;
      case 'w': // Ctrl+W: delete word before cursor
        e.preventDefault(); {
          const pos = inp.selectionStart;
          const before = inp.value.slice(0, pos);
          const after = inp.value.slice(pos);
          const trimmed = before.replace(/\s*\S+\s*$/, '');
          inp.value = trimmed + after;
          inp.selectionStart = inp.selectionEnd = trimmed.length;
        } break;
      case 'p': // Ctrl+P: previous history (same as Up)
        e.preventDefault();
        if (cmdHistory.length && historyIdx < 0) historyIdx = cmdHistory.length;
        if (historyIdx > 0) inp.value = cmdHistory[--historyIdx]; break;
      case 'n': // Ctrl+N: next history (same as Down)
        e.preventDefault();
        if (historyIdx >= 0) {
          historyIdx++;
          inp.value = historyIdx >= cmdHistory.length ? '' : cmdHistory[historyIdx];
          if (historyIdx >= cmdHistory.length) historyIdx = -1;
        } break;
      case 'l': // Ctrl+L: clear screen
        e.preventDefault(); doClear(); break;
      case 'c': // Ctrl+C: cancel
        e.preventDefault();
        inp.disabled = true;
        lastInputRow.innerHTML = promptHtml() + esc(inp.value) + '^C';
        newInputRow(); break;
      case 'r': // Ctrl+R: reverse search (simple version)
        e.preventDefault(); {
          const query = inp.value;
          if (query) {
            for (let i = cmdHistory.length - 1; i >= 0; i--) {
              if (cmdHistory[i].includes(query)) {
                inp.value = cmdHistory[i];
                historyIdx = i;
                break;
              }
            }
          }
        } break;
      case 'h': // Ctrl+H: backspace (already handled by browser, but just in case)
        break;
      case 'd': // Ctrl+D: delete char under cursor / exit if empty
        e.preventDefault();
        if (inp.value.length === 0) {
          print('exit', 'dim');
          print('Use browser refresh to restart.', 'dim');
        } else {
          const pos = inp.selectionStart;
          inp.value = inp.value.slice(0, pos) + inp.value.slice(pos + 1);
          inp.selectionStart = inp.selectionEnd = pos;
        } break;
      case 'b': // Ctrl+B: move cursor left one char
        e.preventDefault();
        if (inp.selectionStart > 0) inp.selectionStart = inp.selectionEnd = inp.selectionStart - 1;
        break;
      case 'f': // Ctrl+F: move cursor right one char
        e.preventDefault();
        if (inp.selectionStart < inp.value.length) inp.selectionStart = inp.selectionEnd = inp.selectionStart + 1;
        break;
    }
  }
}

function doTab(inp) {
  const val = inp.value, parts = val.split(/\s+/), last = parts[parts.length - 1] || '';
  if (parts.length <= 1) {
    const m = cmdNames.filter(c => c.startsWith(last));
    if (m.length === 1) { inp.value = m[0] + ' '; tabIdx = -1; }
    else if (m.length > 1) { print(m.join('  ')); tabIdx = -1; }
    return;
  }
  let target, prefix;
  if (last.includes('/')) {
    const i = last.lastIndexOf('/');
    const dirP = last.slice(0, i) || '/';
    prefix = last.slice(i + 1);
    const n = getNode(dirP);
    if (!n || n.type !== DIR) return;
    target = n;
  } else { target = getNode('.'); prefix = last; }

  if (tabIdx === -1 || !tabMatches.length) {
    tabMatches = Object.keys(target.children).filter(n => n.startsWith(prefix));
    tabIdx = 0;
  }
  if (!tabMatches.length) return;
  const match = tabMatches[tabIdx % tabMatches.length];
  const isDir = target.children[match].type === DIR;
  const base = last.includes('/') ? last.slice(0, last.lastIndexOf('/') + 1) : '';
  parts[parts.length - 1] = base + match + (isDir ? '/' : ' ');
  inp.value = parts.join(' ');
  tabIdx++;
}

function doClear() {
  termEl.querySelectorAll('.line').forEach(l => l.remove());
  if (lastInputRow) lastInputRow.remove();
  newInputRow();
}

function terminalAction(type) {
  if (type === 'close') { print('Session ended. Refresh page to restart.', 'dim'); }
}

// ── Command parser ─────────────────────────────────────
function tokenize(input) {
  const tokens = []; let cur = '', inQ = false, qCh = '';
  for (let i = 0; i < input.length; i++) {
    const c = input[i];
    if (inQ) { if (c === qCh) { inQ = false; continue; } cur += c; }
    else if (c === '"' || c === "'") { inQ = true; qCh = c; }
    else if (c === ' ' || c === '\t') { if (cur) { tokens.push(cur); cur = ''; } }
    else cur += c;
  }
  if (cur) tokens.push(cur);
  return tokens;
}

function expandVars(s) {
  return s.replace(/\$(\w+)/g, (_, v) => envVars[v] || '');
}

// ── Commands ───────────────────────────────────────────
const cmds = {};
const cmdNames = [];

function register(name, fn) { cmds[name] = fn; cmdNames.push(name); }

register('help', () => {
  const rows = [
    ['ls [-la] [path]', 'List directory contents'],
    ['cd [path]', 'Change directory (supports ~, -)'],
    ['pwd', 'Print working directory'],
    ['cat [file...]', 'Display file contents'],
    ['mkdir [-p] path', 'Create directory'],
    ['touch [file]', 'Create empty file'],
    ['rm [-r/-rf] path', 'Remove file or directory'],
    ['cp src dest', 'Copy file'],
    ['mv src dest', 'Move or rename'],
    ['find [path] -name pat', 'Find files by name'],
    ['tree [path]', 'Display directory tree'],
    ['echo text [> / >> file]', 'Print text / write to file'],
    ['grep pattern file', 'Search in file'],
    ['head [-n N] file', 'First N lines'],
    ['tail [-n N] file', 'Last N lines'],
    ['wc [-lwc] file', 'Word/line/char count'],
    ['sort [file]', 'Sort lines'],
    ['uniq', 'Remove duplicate lines (pipe)'],
    ['clear', 'Clear terminal'],
    ['whoami', 'Current user'],
    ['date', 'Current date/time'],
    ['uname [-a]', 'System info'],
    ['hostname', 'Hostname'],
    ['uptime', 'System uptime'],
    ['env', 'Show environment variables'],
    ['export VAR=val', 'Set environment variable'],
    ['alias name=val', 'List/set aliases'],
    ['history', 'Command history'],
    ['nano file', 'Edit file'],
    ['vi file', 'Edit file'],
    ['theme [name]', 'Change theme (github-dark, dracula, monokai)'],
    ['neofetch', 'System info + ASCII art'],
    ['man [cmd]', 'Command manual'],
    ['save', 'Save file system to browser'],
    ['reset', 'Reset file system to default'],
  ];
  print('Available commands:\n');
  for (const [c, d] of rows) print(`  ${c.padEnd(32)} ${d}`);
  print('\nKeyboard shortcuts:');
  print('  <span class="info">Up/Down</span>    Command history');
  print('  <span class="info">Tab</span>        Auto-complete');
  print('  <span class="info">Ctrl+A</span>     Go to beginning of line');
  print('  <span class="info">Ctrl+E</span>     Go to end of line');
  print('  <span class="info">Ctrl+U</span>     Clear line before cursor');
  print('  <span class="info">Ctrl+K</span>     Clear line after cursor');
  print('  <span class="info">Ctrl+W</span>     Delete word before cursor');
  print('  <span class="info">Ctrl+P/N</span>   Previous/Next history');
  print('  <span class="info">Ctrl+R</span>     Reverse search history');
  print('  <span class="info">Ctrl+B/F</span>   Move cursor left/right');
  print('  <span class="info">Ctrl+D</span>     Delete char / exit');
  print('  <span class="info">Ctrl+C</span>     Cancel input');
  print('  <span class="info">Ctrl+L</span>     Clear screen');
});

register('ls', args => {
  let all = false, long = false; const paths = [];
  for (const a of args) {
    if (a.startsWith('-') && a.length > 1 && a !== '--') {
      if (a.includes('a')) all = true;
      if (a.includes('l')) long = true;
    } else paths.push(a);
  }
  if (!paths.length) paths.push('.');
  for (const p of paths) {
    const node = getNode(p);
    if (!node) { print(`ls: cannot access '${p}': No such file or directory`, 'error'); continue; }
    if (node.type === FILE) {
      if (long) print(fmtLong(node, node.name));
      else print(node.name);
      continue;
    }
    if (paths.length > 1) print(`<span class="dir">${esc(resolvePath(p))}:</span>`);
    let entries = Object.entries(node.children);
    if (!all) entries = entries.filter(([n]) => !n.startsWith('.'));
    entries.sort((a, b) => a[0].localeCompare(b[0]));
    if (long) {
      print(`total ${entries.length}`);
      if (all) { print(fmtLong(node, '.')); print(fmtLong(node, '..')); }
      for (const [n, c] of entries) print(fmtLong(c, n));
    } else {
      const line = entries.map(([n, c]) =>
        `<span class="${c.type === DIR ? 'dir' : ''}">${esc(n)}</span>`
      ).join('  ');
      print(line || '');
    }
  }
});

function fmtLong(node, name) {
  const d = node.type === DIR;
  const perm = d ? 'drwxr-xr-x' : '-rw-r--r--';
  const sz = String(d ? 4096 : (node.content || '').length).padStart(5);
  const dt = node.modified ? fmtDate(node.modified) : 'May  4 10:00';
  const cls = d ? ' dir' : '';
  return `${perm}  1 user user ${sz} ${dt} <span class="line${cls}">${esc(name)}</span>`;
}
function fmtDate(d) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${String(d.getDate()).padStart(2)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

register('cd', args => {
  const target = args[0];
  if (!target || target === '~') { prevDir = cwd; cwd = '/home/user'; return; }
  if (target === '-') { const t = prevDir; prevDir = cwd; cwd = t; return; }
  const resolved = resolvePath(target);
  const node = getNode(target);
  if (!node) { print(`cd: ${target}: No such file or directory`, 'error'); return; }
  if (node.type !== DIR) { print(`cd: ${target}: Not a directory`, 'error'); return; }
  prevDir = cwd; cwd = resolved;
});

register('pwd', () => print(cwd));

register('cat', args => {
  if (!args.length) { print('cat: missing operand', 'error'); return; }
  for (const a of args) {
    const n = getNode(a);
    if (!n) { print(`cat: ${a}: No such file or directory`, 'error'); continue; }
    if (n.type === DIR) { print(`cat: ${a}: Is a directory`, 'error'); continue; }
    print(esc(n.content));
  }
});

register('mkdir', args => {
  let rec = false; const paths = [];
  for (const a of args) { if (a === '-p') { rec = true; continue; } paths.push(a); }
  for (const p of paths) {
    if (getNode(p)) { print(`mkdir: cannot create '${p}': File exists`, 'error'); continue; }
    if (rec) {
      const parts = resolvePath(p).split('/').filter(Boolean);
      let cur = root;
      for (const s of parts) {
        if (!cur.children[s]) cur.children[s] = mkDir(s);
        cur = cur.children[s];
      }
    } else {
      const { parent, name } = parentOf(p);
      if (!parent) { print(`mkdir: cannot create '${p}': No such file or directory`, 'error'); continue; }
      addC(parent, mkDir(name));
    }
  }
});

register('touch', args => {
  for (const a of args) {
    if (getNode(a)) { getNode(a).modified = new Date(); continue; }
    const { parent, name } = parentOf(a);
    if (!parent) { print(`touch: cannot touch '${a}'`, 'error'); continue; }
    addC(parent, mkFile(name, ''));
  }
});

register('rm', args => {
  let rec = false, force = false; const paths = [];
  for (const a of args) {
    if (a.startsWith('-')) { if (a.includes('r')) rec = true; if (a.includes('f')) force = true; continue; }
    paths.push(a);
  }
  for (const p of paths) {
    const n = getNode(p);
    if (!n) { if (!force) print(`rm: cannot remove '${p}': No such file or directory`, 'error'); continue; }
    if (n.type === DIR && !rec) { print(`rm: cannot remove '${p}': Is a directory`, 'error'); continue; }
    const { parent, name } = parentOf(p);
    if (parent) delete parent.children[name];
  }
});

register('cp', args => {
  if (args.length < 2) { print('cp: missing operand', 'error'); return; }
  const src = args[args.length - 2], dest = args[args.length - 1];
  const sn = getNode(src);
  if (!sn) { print(`cp: cannot stat '${src}'`, 'error'); return; }
  if (sn.type === DIR) { print(`cp: omitting directory '${src}'`, 'error'); return; }
  const dn = getNode(dest);
  if (dn && dn.type === DIR) { addC(dn, mkFile(sn.name, sn.content)); }
  else {
    const { parent, name } = parentOf(dest);
    if (!parent) { print(`cp: cannot create '${dest}'`, 'error'); return; }
    parent.children[name] = mkFile(name, sn.content);
  }
});

register('mv', args => {
  if (args.length < 2) { print('mv: missing operand', 'error'); return; }
  const src = args[0], dest = args[1];
  const sn = getNode(src);
  if (!sn) { print(`mv: cannot stat '${src}'`, 'error'); return; }
  const { parent: sp, name: sName } = parentOf(src);
  const dn = getNode(dest);
  if (dn && dn.type === DIR) { addC(dn, sn); }
  else {
    const { parent: dp, name: dName } = parentOf(dest);
    if (!dp) { print(`mv: cannot move to '${dest}'`, 'error'); return; }
    sn.name = dName; dp.children[dName] = sn;
  }
  if (sp) delete sp.children[sName];
});

register('find', args => {
  let searchPath = '.', namePat = '*';
  for (let i = 0; i < args.length; i++) {
    if (args[i] === '-name' && i + 1 < args.length) namePat = args[++i];
    else if (!args[i].startsWith('-')) searchPath = args[i];
  }
  const start = getNode(searchPath);
  if (!start || start.type !== DIR) { print(`find: '${searchPath}': No such directory`, 'error'); return; }
  const re = new RegExp('^' + namePat.replace(/\*/g, '.*').replace(/\?/g, '.') + '$');
  (function walk(node, path) {
    for (const [n, c] of Object.entries(node.children)) {
      const fp = path + '/' + n;
      if (re.test(n)) print(fp);
      if (c.type === DIR) walk(c, fp);
    }
  })(start, resolvePath(searchPath) === '/' ? '' : resolvePath(searchPath));
});

register('tree', args => {
  const t = args[0] || '.';
  const n = getNode(t);
  if (!n || n.type !== DIR) { print(`tree: '${t}' is not a directory`, 'error'); return; }
  let dirs = 0, files = 0;
  print(`<span class="dir">${esc(resolvePath(t))}</span>`);
  (function walk(node, prefix) {
    const entries = Object.entries(node.children).filter(([nm]) => !nm.startsWith('.')).sort(([a,ca],[b,cb]) => {
      if (ca.type !== cb.type) return ca.type === DIR ? -1 : 1;
      return a.localeCompare(b);
    });
    entries.forEach(([nm, c], i) => {
      const last = i === entries.length - 1;
      const conn = last ? '└── ' : '├── ';
      const cls = c.type === DIR ? ' dir' : '';
      print(`${esc(prefix)}${conn}<span class="line${cls}">${esc(nm)}</span>`);
      if (c.type === DIR) { dirs++; walk(c, prefix + (last ? '    ' : '│   ')); }
      else files++;
    });
  })(n, '');
  print(`\n${dirs} directories, ${files} files`);
});

register('echo', args => {
  let redir = null, append = false; const txt = [];
  for (let i = 0; i < args.length; i++) {
    if (args[i] === '>>' && i + 1 < args.length) { redir = args[++i]; append = true; }
    else if (args[i] === '>' && i + 1 < args.length) { redir = args[++i]; }
    else txt.push(args[i]);
  }
  const text = txt.join(' ').replace(/^["']|["']$/g, '');
  const expanded = expandVars(text);
  if (redir) {
    const { parent, name } = parentOf(redir);
    if (!parent) { print(`bash: ${redir}: No such file or directory`, 'error'); return; }
    if (parent.children[name] && append) parent.children[name].content += '\n' + expanded;
    else parent.children[name] = mkFile(name, expanded);
  } else print(esc(expanded));
});

register('grep', args => {
  if (args.length < 2) { print('Usage: grep PATTERN FILE', 'error'); return; }
  const pat = args[0];
  for (let i = 1; i < args.length; i++) {
    const n = getNode(args[i]);
    if (!n || n.type === DIR) { print(`grep: ${args[i]}`, 'error'); continue; }
    for (const line of n.content.split('\n')) {
      if (line.includes(pat)) {
        const h = esc(line).replace(new RegExp(esc(pat), 'g'), `<span style="color:var(--error);font-weight:bold">${esc(pat)}</span>`);
        print(h);
      }
    }
  }
});

register('head', args => {
  let n = 10; const files = [];
  for (let i = 0; i < args.length; i++) {
    if (args[i] === '-n' && i + 1 < args.length) n = parseInt(args[++i]) || 10;
    else files.push(args[i]);
  }
  for (const f of files) {
    const nd = getNode(f);
    if (!nd || nd.type === DIR) { print(`head: ${f}`, 'error'); continue; }
    print(esc(nd.content.split('\n').slice(0, n).join('\n')));

});

register('tail', args => {
  let n = 10; const files = [];
  for (let i = 0; i < args.length; i++) {
    if (args[i] === '-n' && i + 1 < args.length) n = parseInt(args[++i]) || 10;
    else files.push(args[i]);
  }
  for (const f of files) {
    const nd = getNode(f);
    if (!nd || nd.type === DIR) { print(`tail: ${f}`, 'error'); continue; }
    print(esc(nd.content.split('\n').slice(-n).join('\n')));
  }
});

register('wc', args => {
  for (const f of args) {
    if (f.startsWith('-')) continue;
    const n = getNode(f);
    if (!n || n.type === DIR) { print(`wc: ${f}`, 'error'); continue; }
    const l = n.content.split('\n').length;
    const w = n.content.split(/\s+/).filter(Boolean).length;
    const c = n.content.length;
    print(`  ${l}\t${w}\t${c}\t${f}`);
  }
});

register('sort', args => {
  for (const f of args) {
    if (f.startsWith('-')) continue;
    const n = getNode(f);
    if (!n || n.type === DIR) { print(`sort: ${f}`, 'error'); continue; }
    print(esc(n.content.split('\n').filter(Boolean).sort().join('\n')));
  }
});

register('uniq', args => {
  // Try to read from args (pipe injects /tmp/__pipe__) or fail
  const f = args.find(a => !a.startsWith('-'));
  if (f) {
    const n = getNode(f);
    if (n && n.type === FILE) {
      const lines = n.content.split('\n').filter(Boolean);
      const result = lines.filter((l, i) => i === 0 || l !== lines[i - 1]);
      print(esc(result.join('\n')));
      return;
    }
  }
  print('uniq: reads from stdin (use pipes: cat file | sort | uniq)');
});

register('vi', args => openEditor(args));

function openEditor(args) {
  if (!args.length) { print('Usage: nano <filename>', 'error'); return; }
  const n = getNode(args[0]);
  const content = n && n.type === FILE ? n.content : '';
  const editorTitle = `GNU nano 6.2        ${args[0]}`;
  $('#editor-title').textContent = editorTitle;
  $('#editor-text').value = content;
  $('#editor-overlay').style.display = 'block';
  $('#editor-text').focus();

  const overlay = $('#editor-overlay');
  const textarea = $('#editor-text');
  const saveAndClose = () => {
    const { parent, name } = parentOf(args[0]);
    if (parent) {
      parent.children[name] = mkFile(name, textarea.value);
    }
    overlay.style.display = 'none';
    print(`[Saved ${args[0]}]`, 'success');
    textarea.removeEventListener('keydown', editorKeys);
  };
  const editorKeys = (e) => {
    if (e.key === 's' && e.ctrlKey) { e.preventDefault(); saveAndClose(); }
    else if (e.key === 'x' && e.ctrlKey) { e.preventDefault(); overlay.style.display = 'none'; textarea.removeEventListener('keydown', editorKeys); }
  };
  textarea.addEventListener('keydown', editorKeys);
}

register('save', () => {
  try {
    const data = { root: serializeFS(root), cwd, envVars, aliases, history: cmdHistory.slice(-100) };
    localStorage.setItem('weblinux-save', JSON.stringify(data));
    print('File system saved to browser storage.', 'success');
  } catch(e) { print(`Save failed: ${e.message}`, 'error'); }
});

register('reset', () => {
  initFS(); cwd = '/home/user'; envVars.PWD = cwd;
  localStorage.removeItem('weblinux-save');
  print('File system reset to default.', 'success');
});

function serializeFS(node) {
  if (node.type === FILE) return { type: FILE, name: node.name, content: node.content };
  const children = {};
  for (const [n, c] of Object.entries(node.children)) children[n] = serializeFS(c);
  return { type: DIR, name: node.name, children };
}

function loadFS() {
  try {
    const raw = localStorage.getItem('weblinux-save');
    if (!raw) return false;
    const data = JSON.parse(raw);
    root = deserializeFS(data.root);
    if (data.cwd) cwd = data.cwd;
    if (data.envVars) Object.assign(envVars, data.envVars);
    if (data.aliases) aliases = data.aliases;
    if (data.history) cmdHistory = data.history;
    return true;
  } catch { return false; }
}

function deserializeFS(obj) {
  if (obj.type === FILE) return mkFile(obj.name, obj.content || '');
  const dir = mkDir(obj.name);
  if (obj.children) for (const [n, c] of Object.entries(obj.children)) dir.children[n] = deserializeFS(c);
  return dir;
}

// ── Pipeline executor ──────────────────────────────────
let pipeMode = false;
let pipeBuffer = [];

const origPrint = print;

function run(input) {
  const trimmed = input.trim();
  if (!trimmed) return;

  const isPipe = trimmed.includes('|');
  const stages = isPipe ? trimmed.split('|').map(s => s.trim()) : [trimmed];

  let pipeData = null;

  for (let si = 0; si < stages.length; si++) {
    const tokens = tokenize(stages[si]);
    if (!tokens.length) continue;

    let cmd = tokens[0], args = tokens.slice(1);

    if (aliases[cmd]) {
      const exp = tokenize(aliases[cmd]);
      cmd = exp[0]; args = [...exp.slice(1), ...args];
    }

    args = args.map(a => {
      if (a.startsWith('$')) return envVars[a.slice(1)] || '';
      return expandVars(a);
    });

    if (!cmds[cmd]) {
      print(`bash: ${cmd}: command not found`, 'error');
      print('Type <span class="info">help</span> for available commands.');
      return;
    }

    const isLast = si === stages.length - 1;

    if (isPipe && !isLast) {
      // Capture output: inject pipe data as temp file, run command, collect text output
      if (pipeData !== null) {
        root.children['tmp'].children['__pipe__'] = mkFile('__pipe__', pipeData);
        args.push('/tmp/__pipe__');
      }
      pipeBuffer = [];
      pipeMode = true;
      cmds[cmd](args);
      pipeMode = false;
      pipeData = pipeBuffer.join('\n');
      pipeBuffer = [];
      delete root.children['tmp'].children['__pipe__'];
    } else if (isPipe && isLast && pipeData !== null) {
      // Last stage with pipe input
      root.children['tmp'].children['__pipe__'] = mkFile('__pipe__', pipeData);
      args.push('/tmp/__pipe__');
      cmds[cmd](args);
      delete root.children['tmp'].children['__pipe__'];
    } else {
      cmds[cmd](args);
    }
  }
}

// Override print to support pipe capture
const _realPrint = print;
print = function(text, cls) {
  if (pipeMode) {
    const div = document.createElement('div');
    div.innerHTML = text;
    pipeBuffer.push(div.textContent);
    return;
  }
  _realPrint(text, cls);
};
